  brugger:
    name: Eric Brugger
    pic: https://bluewaters.ncsa.illinois.edu/liferay-content/image-gallery/webinar%20photos/eric_brugger.png
    affiliation: "[LLNL](https://www.llnl.gov)"
    vfocus: VisIt Project Lead, DevOps
    github: https://github.com/brugger1
    email: brugger1@llnl.gov
    bio: "Eric Brugger has over 25 years' experience developing and using scientific visualization and analysis software. He is the VisIt project leader and one of the original developers of the software. He received an R&D 100 award in 2005 as part of the development team of VisIt. He has extensive experience assisting users visualize and understand their simulation data as well as providing hands on VisIt training in workshop settings."
  cyrush:
    name: Cyrus Harrison
    pic: https://avatars.githubusercontent.com/u/1194526
    affiliation: "[LLNL](https://www.llnl.gov)"
    vfocus: VisIt CLI, In-Situ Analysis, Python
    github: https://github.com/cyrush
    email: harrison37@llnl.gov
    bio: "Cyrus is Computer Scientist and Associate Division Leader in the Applications, Simulations, and Quality (ASQ) division of LLNL's Computing directorate. He develops data management, analysis, and visualization tools that support large scale multi-physics simulations. He is the software architect of the VisIt open source visualization tool and leads major aspects of the technical direction of the project. Cyrus also provides custom data analysis solutions for WCI's WSC and WPD programs. Cyrus obtained a B.S. (2003) and Masters (2004) of Computer Engineering from the University of Florida. He joined LLNL in February 2005."
  griffin:
    name: Kevin Griffin
    pic: https://media.licdn.com/dms/image/v2/D5603AQFjv0koFJVYgA/profile-displayphoto-shrink_200_200/profile-displayphoto-shrink_200_200/0/1710019866959?e=2147483647&v=beta&t=u5mmPVxhbVNMLkKMAEVJUuDZwGqu-LoSNTGYSGqRjWc
    affiliation: "NVIDIA"
    vfocus: OSX, Operator plugins, Volume rendering
    github: https://github.com/griffin28
    email: kgriffin@nvidia.com
    bio: "Kevin Griffin is a Senior Developer Technology Engineer at NVIDIA where he is working on the integration of scientific visualization software with NVIDIA’s Omniverse platform and a high-level API called ANARI (Analytic Rendering Interface) that supports diverse rendering back-ends. He is also an Adjunct Associate Professor at San Joaquin Delta College where he teaches computer science courses. Kevin has previously worked at Lawrence Livermore National Laboratory where he was a Group Leader, Software Developer, and Solutions Executive for the High-Performance Computing Innovation Center."
  miller:
    name: Mark C. Miller
    pic: https://avatars.githubusercontent.com/u/5720676
    affiliation: "[LLNL](https://www.llnl.gov)"
    vfocus: VisIt Db plugins, Scalable I/O, Data Models
    github: https://github.com/markcmiller86
    email: miller86@llnl.gov
    bio: "Mark has supported [VisIt](http://visit.llnl.gov) and led development of [Silo](https://silo.llnl.gov) for scalable I/O requirements of LLNL HPC simulation codes such as [ALE3D](https://wci.llnl.gov/simulation/computer-codes/ale3d) [Kull, Ares, LASNEX and Overlink](https://wci.llnl.gov/simulation/computer-codes) for 30+ years.  Mark's interests include data models and their impact on software interoperability, high performance I/O, and Software Quality Engineering ([Smart Libraries](https://github.com/markcmiller86/SAF/blob/master/src/safapi/docs/necdc_2004_paper_30Nov04.pdf)) for HPC libraries."
  privitera:
    name: Justin Privitera
    pic: https://media.licdn.com/dms/image/v2/C5603AQGbtu_hDyi1wQ/profile-displayphoto-shrink_200_200/profile-displayphoto-shrink_200_200/0/1545612922134?e=2147483647&v=beta&t=8dXJYA2UjW1nabQxqQtnWvAWzxpPbcyAl3UEJvoH6C0
    affiliation: "[LLNL](https://www.llnl.gov)"
    github: https://github.com/JustinPrivitera
